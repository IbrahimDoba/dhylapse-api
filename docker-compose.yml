services:
  postgres:
    image: postgres:18-alpine
    container_name: dhylapse-pg
    environment:
      POSTGRES_USER: dhylapse
      POSTGRES_PASSWORD: dhylapse
      POSTGRES_DB: dhylapse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhylapse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
